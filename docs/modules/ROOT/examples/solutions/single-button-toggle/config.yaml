entities:
  - file: /etc/OliveTin/entities/water_valve.yaml
    name: water_valve

actions:
  - title: Toggle valve
    icon: '<img src="/custom-webui/icons/{{ .CurrentEntity.state }}.png" width="48px" />'
    entity: water_valve
    shell: |
      set -e
      if [ "{{ .CurrentEntity.state }}" = "open" ]; then
        next_state=closed
      else
        next_state=open
      fi
      echo "Setting {{ .CurrentEntity.title }} to $next_state"
      printf -- '- title: %s\n  state: %s\n' "{{ .CurrentEntity.title }}" "$next_state" > /etc/OliveTin/entities/water_valve.yaml

dashboards:
  - title: Water Valve
    contents:
      - title: "{{ water_valve.title }}"
        type: fieldset
        entity: water_valve
        contents:
          - type: display
            title: |
              State: <strong>{{ water_valve.state }}</strong>

          - title: Toggle valve
