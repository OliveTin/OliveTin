# Marketing screenshots, captured by `make` in this directory against the
# throwaway OliveTin it starts with the fictional config in seed/.
#
# title/description/theme are not used by repo-helper; `make manifest` turns
# them into screenshot-manifest.yaml for indexers. Every section needs them.

[DEFAULT]
base_url = http://127.0.0.1:18337/
dir = .
width = 1280
height = 800
script = scripts/light.py, scripts/prepare.py
post_script_sleep = 1.5
theme = light
manifest_project = OliveTin
manifest_base_url = https://raw.githubusercontent.com/OliveTin/OliveTin/main/var/marketing/screenshots/

[dashboard]
url = .
title = Action buttons
description = Your predefined shell commands appear as simple, touch-friendly buttons, so anyone can run them safely without a terminal.

[argument-form]
url = .
script = scripts/light.py, scripts/prepare.py, scripts/argument_form.py
title = Arguments
description = Actions can ask for input before they run, with typed and validated fields, defaults and dropdowns, so commands only ever run with sensible values.

[execution]
url = logs/5eed0000-0000-4000-8000-000000000007
title = Command output
description = Watch a command's output live as it runs, along with whether it succeeded and how long it took.

[entities]
url = dashboards/Servers
title = Dashboards and entities
description = Build dashboards that group actions by the things you manage, such as servers or containers, with one set of buttons generated for each of them.

[logs]
url = logs
title = Execution logs
description = Every action that runs is logged, so you can see who ran what, when, and whether it succeeded.

# Dark and mobile variants last; the browser session is shared, so each
# section pins its own color scheme.
[dashboard-dark]
url = .
script = scripts/dark.py, scripts/prepare.py
theme = dark
title = Dark mode
description = OliveTin follows your browser's dark mode preference automatically.

[dashboard-mobile]
url = .
width = 412
height = 915
title = Mobile layout
description = The responsive layout works well on phones and on wall-mounted tablets, so commands are a tap away wherever you are.
