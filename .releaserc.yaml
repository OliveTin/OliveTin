---
# Only allow releases on the main branch (for 3k)
# releases for 2k are published manually.
branches:
  - name: main

plugins:
  - '@semantic-release/commit-analyzer'
  # Only a draft is created here; GoReleaser adopts it (release.use_existing_draft),
  # replaces the notes and publishes it. This plugin's job is the success comments on
  # resolved issues/PRs, and opening an issue when a release fails.
  - - '@semantic-release/github'
    - draftRelease: true
      releaseBodyTemplate: 'Release notes are generated by GoReleaser.'
      successComment: >-
        This is included in OliveTin
        [<%= nextRelease.version %>](https://github.com/OliveTin/OliveTin/releases/tag/<%= nextRelease.version %>) :tada:
  - '@semantic-release/git'
  - - "@semantic-release/exec"
    - publishCmd: |
        VERSION=${nextRelease.version} GORELEASER_TIMEOUT=60m ./var/windows/goreleaser-release-with-msi.sh

tagFormat: '${version}'
